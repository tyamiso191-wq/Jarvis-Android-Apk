name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          # Repo kökündeki EN YENİ .zip dosyasını kullan (birden fazla zip
          # varsa eskisini değil, sonradan yüklenen sürümü açar).
          ZIP_FILE=$(ls -t ./*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: repo kökünde .zip dosyası bulunamadı"
            exit 1
          fi
          echo "Kullanılan zip: $ZIP_FILE"
          echo "Repodaki tüm zip'ler:"; ls -la ./*.zip
          unzip -o "$ZIP_FILE"
          if [ -d JarvisAndroid ]; then
            cp -r JarvisAndroid/* .
            cp -r JarvisAndroid/.[!.]* . 2>/dev/null || true
          fi
          ls -la
          test -f settings.gradle.kts && echo "OK settings" || (echo "HATA settings yok" && exit 1)
          test -f app/build.gradle.kts && echo "OK app/build" || (echo "HATA app/build yok" && exit 1)
          test -f app/src/main/java/com/jarvis/ai/web/WebSearchClient.kt \
            && echo "OK: web araması (WebSearchClient) var" \
            || echo "UYARI: WebSearchClient.kt yok — eski zip açılmış olabilir"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          SDK_ROOT=$HOME/android-sdk
          mkdir -p $SDK_ROOT/cmdline-tools
          cd $SDK_ROOT/cmdline-tools
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$SDK_ROOT
          export ANDROID_SDK_ROOT=$SDK_ROOT
          export PATH=$PATH:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools
          yes | sdkmanager --sdk_root=$SDK_ROOT --licenses >/dev/null || true
          sdkmanager --sdk_root=$SDK_ROOT "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "sdk.dir=$SDK_ROOT" > $GITHUB_WORKSPACE/local.properties
          cat $GITHUB_WORKSPACE/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace --no-daemon \
            -Pandroid.builder.sdkDownload=true 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            {
              echo '### Derleme hataları'
              echo '```'
              grep -E '^e: |What went wrong' -A4 build.log | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
          
